name: Validate (read-only & EDR safety)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read-only / EDR safety check (Windows PowerShell 5.1)
        shell: powershell
        run: .\Tests\Test-ToolkitSafety.ps1

      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
